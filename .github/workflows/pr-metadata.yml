name: pr metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build changelog body from all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf "## Commits in diesem PR\n\n"
            git log --no-merges --reverse --pretty=format:'### %s (`%h`)%n%n%b%n' "$BASE_SHA..$HEAD_SHA"
          } > pr-body.md

      - name: Update PR title and description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr edit "$PR_NUMBER" --title "Version: $VERSION" --body-file pr-body.md
